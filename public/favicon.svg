<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Fondo negro con corte angular — identidad FORJA -->
  <polygon points="0,0 128,0 128,100 100,128 0,128" fill="#0B0C0E"/>
  <!-- Acento volt en el corte -->
  <polygon points="100,128 128,100 128,128" fill="#CCFF00"/>

  <!-- Mancuerna centrada -->
  <!-- Barra central -->
  <rect x="38" y="58" width="52" height="12" fill="#CCFF00" rx="3"/>

  <!-- Disco izquierdo externo -->
  <rect x="16" y="46" width="12" height="36" fill="#CCFF00" rx="4"/>
  <!-- Disco izquierdo interno -->
  <rect x="28" y="50" width="10" height="28" fill="#CCFF00" rx="3"/>

  <!-- Disco derecho interno -->
  <rect x="90" y="50" width="10" height="28" fill="#CCFF00" rx="3"/>
  <!-- Disco derecho externo -->
  <rect x="100" y="46" width="12" height="36" fill="#CCFF00" rx="4"/>
</svg>
